<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мої книги</title>
<style>
body {font: 18px Arial, sans-serif; max-width: 1000px; margin: 35px auto; padding: 0 20px; color: #222;}
table {border-collapse: collapse; width: 100%; margin-top: 20px;}
td, th {border: 1px solid #bbb; padding: 12px; text-align: left;}
th {background: #eee;}
input, select, button {font: inherit; padding: 8px;}
label {display: block; margin: 15px 0;}
label input, label select {display: block; margin-top: 5px; max-width: 95%;}
td form {display: inline;}
a {color: #174c8e;}
.error {color: #a00;}
footer {margin-top: 40px; color: #555; font-size: 15px;}
</style>
<h1>Мої книги</h1>
{% block content %}{% endblock %}
<footer>Дрегель Дмитро, група КІ-31 · Лабораторна робота 6–7</footer>
</html>
