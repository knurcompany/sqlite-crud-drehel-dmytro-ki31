{% extends 'base.html' %}
{% block content %}
<a href="{{ url_for('add') }}">Додати книгу</a>
{% if items %}
<table>
<tr><th>№</th><th>Назва</th><th>Автор</th><th>Рік</th><th>Стан</th><th>Дії</th></tr>
{% for item in items %}
<tr>
<td>{{ item.id }}</td><td>{{ item.title }}</td><td>{{ item.author }}</td>
<td>{{ item.year }}</td><td>{{ item.status }}</td>
<td><a href="{{ url_for('edit', item_id=item.id) }}">Змінити</a>
<form method="post" action="{{ url_for('delete', item_id=item.id) }}">
<button type="submit">Видалити</button></form></td>
</tr>
{% endfor %}
</table>
{% else %}<p>Список поки порожній.</p>{% endif %}
{% endblock %}
